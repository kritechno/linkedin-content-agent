[project]
name = "linkedin-agent"
version = "0.1.0"
description = "Scheduled agent that researches hot AI topics, drafts posts in Amir's voice, gates them through Telegram, and posts to LinkedIn."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-telegram-bot[job-queue]>=21.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "striprtf>=0.0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkedin-agent = "linkedin_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
